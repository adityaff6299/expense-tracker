<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 80vh; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 400px; }
        h2 { color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-container { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 2; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .btn-cancel { flex: 1; padding: 10px; background-color: #6c757d; color: white; text-align: center; text-decoration: none; border-radius: 4px; font-size: 14px; }
        .btn-cancel:hover { background-color: #5a6268; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Edit Expense</h2>
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Amount (₹)</label>
                <input type="number" name="amount" value="{{ expense.amount }}" step="0.01" required>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select name="category" required>
                    <option value="Food" {% if expense.category == 'Food' %}selected{% endif %}>Food</option>
                    <option value="Travel" {% if expense.category == 'Travel' %}selected{% endif %}>Travel</option>
                    <option value="Shopping" {% if expense.category == 'Shopping' %}selected{% endif %}>Shopping</option>
                    <option value="Housing" {% if expense.category == 'Housing' %}selected{% endif %}>Housing</option>
                    <option value="Healthcare" {% if expense.category == 'Healthcare' %}selected{% endif %}>Healthcare</option>
                    <option value="Entertainment" {% if expense.category == 'Entertainment' %}selected{% endif %}>Entertainment</option>
                    <option value="Other" {% if expense.category == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description</label>
                <input type="text" name="description" value="{{ expense.description }}" required>
            </div>

            <div class="btn-container">
                <button type="submit">Save Changes</button>
                <a href="{% url 'expense_list' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>

</body>
</html>
